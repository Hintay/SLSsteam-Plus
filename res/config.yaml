#Example AppIds Config for those not familiar with YAML:
#AppIds:
#  - 440
#  - 730
#Take care of not messing up your spaces! Otherwise it won't work

#Example of DlcData:
#DlcData:
#  AppId:
#    FirstDlcAppId: "Dlc Name"
#    SecondDlcAppId: "Dlc Name"

#Example of DenuvoGames:
#DenuvoGames:
#  SteamId:
#    -  AppId1
#    -  AppId2

#Example of FakeAppIds:
#FakeAppIds:
#  AppId1: FakeAppId1
#  AppId2: FakeAppId2

#Disables Family Share license locking for self and others
DisableFamilyShareLock: yes

#Switches to whitelist instead of the default blacklist
UseWhitelist: no

#Automatically filter Apps in CheckAppOwnership. Filters everything but Games and Applications. Should not affect DLC checks
#Overrides black-/whitelist. Gets overriden by AdditionalApps
AutoFilterList: yes

#List of AppIds to ex-/include
AppIds:

#Enables playing of not owned games. Respects black-/whitelist AppIds
PlayNotOwnedGames: no

#Additional AppIds to inject (Overrides your black-/whitelist & also overrides OwnerIds for apps you got shared!) Best to use this only on games NOT in your library.
AdditionalApps:

#Extra Data for Dlcs belonging to a specific AppId. Only needed
#when the App you're playing is hit by Steams 64 DLC limit
DlcData:

#Used to retrieve ProductInfo from Steam servers for some games
AppTokens:

#Fake Steam being offline for specified AppIds. Same format as AppIds
FakeOffline:

#Change AppIds of games to enable networking features
#Use 0 as a key to set for all unowned Apps
#Keeps track of the proper AppIds via game launches, so please do not start multiple FakeAppId enabled games simultaneously
FakeAppIds:

#Custom ingame statuses. Set AppId to 0 to disable
IdleStatus:
  AppId: 0
  Title: ""

#Override game titles. Only works with owned appIds! For injected appIds use either UnownedStatus or combine them with FakeAppIds
GameTitles:

#Override purchase time stamps
SubscriptionTimestamps:

#Blocks games from unlocking on wrong accounts
DenuvoGames:

#Automatically disable SLSsteam when steamclient.so does not match a predefined file hash that is known to work
#You should enable this if you're planing to use SLSsteam with Steam Deck's gamemode
SafeMode: no

#Toggles notifications via notify-send
Notifications: yes

#Warn user via notification when steamclient.so hash differs from known safe hash
#Mostly useful for development so I don't accidentally miss an update
WarnHashMissmatch: no

#Notify when SLSsteam is done initializing
NotifyInit: yes

#Enable sending commands to SLSsteam via /tmp/SLSsteam.API
API: no

#Disable cloud saves for unlocked games. Set to "no" if using CloudRedirect or similar.
DisableCloud: yes

#For Player.GetUserStats schema probes with sha_schema, the default sends the
#original request unchanged. Set to "yes" to drop those probes
#for fake-owned apps and inject a fabricated no-connection response instead.
AchievementsSchemaProbeNoConnection: no

#Inject added apps into Steam's live package table (pkg0) and re-evaluate licenses
#without a restart, so deeper Steam subsystems also treat them as owned and runtime
#lua changes apply live. Set to "no" to use only the lighter getSubscribedApps path.
PackageInjection: yes

#Manifest settings:
#Built-in request-code providers: opensteamtool / wudrm / steamrun.
#Providers is the ordered fallback chain: each is tried in turn until one returns a code.
#  Accepts a single value (Providers: wudrm), a block list (- one per line, shown below), or a
#  flow list (Providers: [opensteamtool, wudrm, steamrun]) — all equivalent. A single entry = strict
#  single provider, no fallback. Use a list to control order or restrict to a subset (omit one you
#  can't reach). If the key is omitted, the default chain is opensteamtool -> wudrm -> steamrun.
#Set UseLuaManifestOverrides to "no" to ignore lua manifest overrides and keep Steam IPC's latest manifest gid.
#TimeoutConnectMs caps DNS/TCP/TLS setup; TimeoutTotalMs caps the whole libcurl request.
#ReuseConnection keeps the built-in provider's HTTP/TLS session warm across manifest requests.
Manifest:
  Providers:
    - opensteamtool
    - wudrm
    - steamrun
  UseLuaManifestOverrides: yes
  TimeoutConnectMs: 5000
  TimeoutTotalMs: 10000
  ReuseConnection: yes

#Additional Lua plugin directories scanned after the built-in Steam and user config dirs.
Lua:
  Paths: []

#Changes your account's E-Mail clientsided. Leave blank to disable
FakeEmail: ""

#Changes your wallet's balance clientsidedly. 0 to turn off
FakeWalletBalance: 0

#Log levels:
#Once = 0
#Debug = 1
#Info = 2
#NotifyShort = 3
#NotifyLong = 4
#Warn = 5
#None = 6
LogLevel: 2

#Logs all calls to Steamworks (this makes the logfile huge! Only useful for debugging/analyzing
ExtendedLogging: no
