# ============================================================================
# SLSsteam Configuration
# ============================================================================
# Lines starting with # are comments. Uncomment (remove #) to activate.
# TOML reference: https://toml.io

# --- Core ---

# Disables Family Share license locking for self and others
DisableFamilyShareLock = true

# Switches to whitelist instead of the default blacklist
UseWhitelist = false

# Automatically filter Apps in CheckAppOwnership. Filters everything but
# Games and Applications. Should not affect DLC checks.
# Overrides black-/whitelist. Gets overridden by AdditionalApps.
AutoFilterList = true

# Enables playing of not owned games. Respects black-/whitelist AppIds.
PlayNotOwnedGames = false

# List of AppIds to ex-/include (blacklist or whitelist depending on UseWhitelist)
AppIds = []

# Additional AppIds to inject. Overrides your black-/whitelist & also overrides
# OwnerIds for apps you got shared! Best to use this only on games NOT in your library.
AdditionalApps = []

# Disable cloud saves for unlocked games. Set to false if using CloudRedirect or similar.
DisableCloud = true

# Toggles notifications via notify-send
Notifications = true

# Log levels: Once=0, Debug=1, Info=2, NotifyShort=3, NotifyLong=4, Warn=5, None=6
LogLevel = 2

# --- Optional (uncomment to customize) ---

# Notify when SLSsteam is done initializing
#NotifyInit = true

# Enable sending commands to SLSsteam via /tmp/SLSsteam.API
#API = false

# Changes your account's E-Mail client-side. Leave blank to disable.
#FakeEmail = ""

# Changes your wallet's balance client-side. 0 to turn off.
#FakeWalletBalance = 0

# Logs all calls to Steamworks (huge log! Only for debugging/analyzing)
#ExtendedLogging = false

# Fake Steam being offline for specified AppIds.
#FakeOffline = []

# Custom idle status. Set AppId to 0 to disable.
#[IdleStatus]
#AppId = 0
#Title = ""

# Override game titles. Only works with owned appIds!
# For injected appIds use either UnownedStatus or combine them with FakeAppIds.
# Example: { 440 = "My Custom Title" }
#[GameTitles]

# Override purchase time stamps. Example: { 440 = 1600000000 }
#[SubscriptionTimestamps]

# --- Advanced ---

# Change AppIds of games to enable networking features.
# Use 0 as a key to set for all unowned Apps.
# Example: { 440 = 730 }
#[FakeAppIds]

# Extra Data for DLCs belonging to a specific AppId. Only needed
# when the App you're playing is hit by Steam's 64 DLC limit.
# Example:
#   [DlcData.480]
#   12345 = "DLC Name"
#[DlcData]

# Used to retrieve ProductInfo from Steam servers for some games.
# Example: { 440 = 12345678901234 }
#[AppTokens]

# Blocks games from unlocking on wrong accounts.
# Keys are SteamIDs, values are arrays of AppIDs.
# Example:
#   [DenuvoGames]
#   76561198000000000 = [12345, 67890]
#[DenuvoGames]

# --- Internal (default values are optimal for most users) ---

# Fetch the latest patterns online (HTTPS) on startup to pick up updated
# signatures and IpcHashes for new Steam builds without re-downloading SLSsteam.
#OnlinePatterns = true

# Inject added apps into Steam's live package table (pkg0) and re-evaluate
# licenses without a restart.
#PackageInjection = true

# For Player.GetUserStats schema probes with sha_schema: set to true to drop
# those probes for fake-owned apps and inject a fabricated no-connection response.
#AchievementsSchemaProbeNoConnection = false

# Manifest settings for download functionality.
# Built-in request-code providers: opensteamtool / wudrm / steamrun.
# Providers is the ordered fallback chain.
#[Manifest]
#Providers = ["opensteamtool", "wudrm", "steamrun"]
#UseLuaManifestOverrides = true
#TimeoutConnectMs = 5000
#TimeoutTotalMs = 10000
#ReuseConnection = true

# Additional Lua plugin directories scanned after the built-in Steam and user config dirs.
#[Lua]
#Paths = []
